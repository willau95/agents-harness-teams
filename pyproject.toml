[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agents-harness-teams"
version = "0.1.0-dev"
description = "Universal multi-agent harness for Claude Code and OpenClaw"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["claude-code", "openclaw", "agents", "harness", "multi-agent", "orchestration"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "typer>=0.9.0",
    "sqlalchemy>=2.0.0",
    "watchdog>=4.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "anthropic>=0.25.0",
]

[project.scripts]
harness = "harness.cli:app"

[project.urls]
Homepage = "https://github.com/celestwong0920/agents-harness-teams"
Repository = "https://github.com/celestwong0920/agents-harness-teams"
Issues = "https://github.com/celestwong0920/agents-harness-teams/issues"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
